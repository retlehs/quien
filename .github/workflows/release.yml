name: Release

# Run from the Actions tab or `gh workflow run release.yml -f version=X.Y.Z`.
# The tag job bumps the flake version on main and creates the tag there, so
# every release tag is a correct, pinnable flake. Pushing a tag by hand still
# works, as long as flake.nix already has the matching version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.13.0)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Bump flake version and tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strict semver (no leading zeros), since GoReleaser and Go modules
          # reject anything else and a pushed tag can never be taken back
          num='(0|[1-9][0-9]*)'
          pre_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^$num\.$num\.$num(-$pre_id(\.$pre_id)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected X.Y.Z or X.Y.Z-prerelease, without a leading v"
            exit 1
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # X.Y.Z must be newer than the latest stable release
          core="${VERSION%%-*}"
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed -nE 's|.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V | tail -n1)
          if [ -n "$latest" ] && { [ "$core" = "$latest" ] || [ "$(printf '%s\n' "$latest" "$core" | sort -V | tail -n1)" != "$core" ]; }; then
            echo "::error::Version $VERSION isn't newer than the latest release v$latest"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Prereleases tag main as-is; the flake tracks stable versions only
          if [[ "$VERSION" != *-* ]]; then
            current=$(sed -nE 's/^ *version = "([^"]+)";$/\1/p' flake.nix)
            if [ "$current" != "$VERSION" ]; then
              sed -i -E "s/^( *version = )\"[^\"]+\";$/\1\"$VERSION\";/" flake.nix
              git commit -am "quien: $current -> $VERSION"
            fi
          fi

          # Never tag a commit whose flake doesn't build (e.g. stale vendorHash)
          nix build .#default --print-build-logs

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    # Runs after the tag job on dispatch, or on its own (tag job skipped) on tag push
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check flake version matches tag
        if: ${{ !contains(env.TAG, '-') }}
        run: |
          flake_version=$(sed -nE 's/^ *version = "([^"]+)";$/\1/p' flake.nix)
          if [ "$flake_version" != "${TAG#v}" ]; then
            echo "::error file=flake.nix::flake.nix has version $flake_version but the tag is $TAG. Nothing was published. Release with the Release workflow instead (see CONTRIBUTING.md); only delete this tag if nothing has fetched it yet."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Find previous stable release
        id: previous
        run: |
          # Base the changelog on the last stable release, not an rc of this one
          echo "tag=$(git describe --tags --abbrev=0 --exclude '*-*' "$TAG^" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}

      - name: Extract version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install apt repo tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg rclone

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "${GPG_KEY_ID}:6:" | gpg --import-ownertrust

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Build signed apt repository
        if: ${{ !contains(env.TAG, '-') }}
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          mkdir -p aptrepo/pool/main/q/quien

          # Preserve history: pull existing pool (ignore failure on first run)
          rclone copy r2:quien-apt/pool ./aptrepo/pool || true

          # Drop new .debs into the pool
          cp dist/*.deb ./aptrepo/pool/main/q/quien/

          # Generate per-arch Packages files. Running apt-ftparchive from
          # inside aptrepo/ so the Filename: paths inside Packages are
          # relative to the repo root (pool/main/...), which is what apt
          # joins with the base URL.
          for arch in amd64 arm64; do
            mkdir -p "aptrepo/dists/stable/main/binary-$arch"
            ( cd aptrepo && apt-ftparchive --arch "$arch" packages pool ) \
              > "aptrepo/dists/stable/main/binary-$arch/Packages"
            gzip -kf "aptrepo/dists/stable/main/binary-$arch/Packages"
            if ! [ -s "aptrepo/dists/stable/main/binary-$arch/Packages" ]; then
              echo "ERROR: Packages file for $arch is empty" >&2
              exit 1
            fi
          done

          cat > apt-release.conf <<'CONF'
          APT::FTPArchive::Release::Origin "quien";
          APT::FTPArchive::Release::Label "quien";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64 arm64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "quien apt repository";
          CONF

          apt-ftparchive -c apt-release.conf release aptrepo/dists/stable > aptrepo/dists/stable/Release

          gpg --default-key "$GPG_KEY_ID" --batch --yes -abs \
            -o aptrepo/dists/stable/Release.gpg aptrepo/dists/stable/Release
          gpg --default-key "$GPG_KEY_ID" --batch --yes --clearsign \
            -o aptrepo/dists/stable/InRelease aptrepo/dists/stable/Release

          gpg --armor --export "$GPG_KEY_ID" > aptrepo/pubkey.gpg

          cat > aptrepo/install.sh <<'SH'
          #!/bin/sh
          set -eu

          KEYRING=/usr/share/keyrings/quien.gpg
          SOURCES=/etc/apt/sources.list.d/quien.list

          if [ "$(id -u)" -ne 0 ]; then
            echo "This script must be run as root (try: curl -fsSL https://apt.quien.dev/install.sh | sudo sh)" >&2
            exit 1
          fi

          echo "Installing quien apt repository..."

          curl -fsSL https://apt.quien.dev/pubkey.gpg | gpg --dearmor -o "$KEYRING"
          chmod 644 "$KEYRING"

          echo "deb [signed-by=$KEYRING] https://apt.quien.dev stable main" > "$SOURCES"
          chmod 644 "$SOURCES"

          apt-get update
          apt-get install -y quien

          echo ""
          echo "quien installed. Try: quien google.com"
          SH
          chmod +x aptrepo/install.sh

      - name: Sync apt repository to R2
        if: ${{ !contains(env.TAG, '-') }}
        run: rclone sync ./aptrepo r2:quien-apt

      - name: Render AUR PKGBUILDs
        if: ${{ !contains(env.TAG, '-') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SRC=$(curl -fsSL "https://github.com/$REPO/archive/$TAG.tar.gz" | sha256sum | awk '{print $1}')
          SHA_AMD64=$(sha256sum dist/quien_linux_amd64.tar.gz | awk '{print $1}')
          SHA_ARM64=$(sha256sum dist/quien_linux_arm64.tar.gz | awk '{print $1}')

          mkdir -p aur/quien aur/quien-bin
          sed -e "s|PKGVER|$VERSION|g" \
              -e "s|SHA256SUM_SOURCE|$SHA_SRC|g" \
              packaging/aur/quien/PKGBUILD.template > aur/quien/PKGBUILD
          sed -e "s|PKGVER|$VERSION|g" \
              -e "s|SHA256SUM_BIN_AMD64|$SHA_AMD64|g" \
              -e "s|SHA256SUM_BIN_ARM64|$SHA_ARM64|g" \
              packaging/aur/quien-bin/PKGBUILD.template > aur/quien-bin/PKGBUILD

      - name: Publish quien to AUR
        if: ${{ !contains(env.TAG, '-') }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: quien
          pkgbuild: ./aur/quien/PKGBUILD
          commit_username: Ben Word
          commit_email: ben@benword.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Publish quien-bin to AUR
        if: ${{ !contains(env.TAG, '-') }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: quien-bin
          pkgbuild: ./aur/quien-bin/PKGBUILD
          commit_username: Ben Word
          commit_email: ben@benword.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
